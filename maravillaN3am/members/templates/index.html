<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members List</title>
</head>
<body>
    <h1>Members List</h1>
    
    <ul>
        {% for member in mymembers %}
            <li>{{ member.first_name }} {{ member.last_name }}</li>
        {% empty %}
            <li>No members found.</li>
        {% endfor %}
    </ul>


</body>
</html>
